# correto: sentinel-k8s-hostpath
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      volumes:
        - name: dados
          emptyDir: {}
      containers:
        - name: app
          image: registry.exemplo.com/app:1.4.2
