apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: registry.exemplo.com/app:1.4.2
          securityContext:
            # alvo: sentinel-k8s-roda-como-root
            runAsUser: 0
